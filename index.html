<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>JANレジスキャナー</title>
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff}
.app{max-width:560px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
header{background:#1e293b;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.pill{border-radius:20px;background:#334155;padding:5px 10px;font-size:12px}.pill.on{background:#166534}
.camera{position:relative;min-height:245px;background:#000;overflow:hidden;flex:none}
#reader{width:100%!important;min-height:245px;background:#000}#reader video{width:100%!important;max-height:255px!important;object-fit:contain!important}
.frame{display:none}
.frame:before{content:"";position:absolute;top:50%;left:6%;right:6%;height:1px;background:#4ade80}
.hint{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:11px;text-shadow:0 1px 3px black;pointer-events:none}
.controls{display:flex;gap:7px;padding:9px 12px;background:#1e293b}
button{border:0;border-radius:10px;cursor:pointer;font:inherit;font-weight:650;padding:12px}
button:disabled{opacity:.45}
.controls button{flex:1;background:#334155;color:#fff;font-size:12px;padding:11px 5px}
.content{background:#f1f5f9;color:#1e293b;flex:1;border-radius:18px 18px 0 0;padding:13px;display:flex;flex-direction:column}
.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.count{background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:bold;border-radius:20px;padding:5px 9px}
#status{color:#475569;font-size:12px;min-height:20px;margin-bottom:8px;overflow-wrap:anywhere}
#list{flex:1;max-height:48dvh;overflow-y:auto}
.item{display:flex;align-items:center;gap:7px;background:white;border-radius:10px;padding:10px;margin:0 0 8px}
.code{font-size:14px;font-weight:700;flex:1;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:5px}
.qty button{padding:0;width:28px;height:29px;background:#eef2f7;color:#334155}
.qty span{min-width:22px;text-align:center;font-weight:700}
.del{background:transparent;color:#dc2626;font-size:20px;padding:4px}
.empty{text-align:center;color:#94a3b8;font-size:13px;padding:25px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.actions button{font-size:13px}
.blue{background:#2563eb;color:white}
.gray{background:#e2e8f0;color:#334155}
.green{background:#16a34a;color:white;grid-column:span 2}
.note{font-size:11px;color:#64748b;line-height:1.6;margin:9px 0 0}
</style>
</head>
<body>
<div class="app">
<header><h1>JANレジスキャナー</h1><span id="state" class="pill">準備中</span></header>
<div class="camera"><div id="reader"></div><div class="hint">JANを横長の枠に合わせてください</div></div>
<div class="controls"><button id="start">📷 カメラ起動</button><button id="stop" disabled>カメラ停止</button><button id="sound">🔊 音ON</button></div>

<main class="content">
<div class="heading"><strong>読み取り一覧</strong><span id="count" class="count">0種（計0点）</span></div>
<div id="status" role="status">カメラ準備中...</div>
<div id="list"></div>
<div class="actions">
<button id="copy" class="blue">📋 コピー</button><button id="clear" class="gray">一覧クリア</button>
<button id="send" class="green" disabled>シート1へ送信（GAS未接続）</button>
</div>
<p class="note">読み取り履歴はこの端末内に一時保存されます。シート1への送信はGAS接続後に有効化します。</p>
</main></div>
<script>
const $=id=>document.getElementById(id);
const KEY='jan_reg_scanner_v1';
let items=[],scanner=null,running=false,busy=false,sound=true,audio=null;
let lastCode='',lastSeen=0,lastAccept=0;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))items=saved.filter(x=>/^\d{13}$/.test(x.code)&&Number.isInteger(x.qty)&&x.qty>0).slice(0,500);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
function status(s){$('status').textContent=s;}
function controls(){
 $('start').disabled=running||busy;$('stop').disabled=!running||busy;
 $('state').textContent=running?'スキャン中':busy?'起動中':'停止中';
 $('state').classList.toggle('on',running);
 $('copy').disabled=items.length===0;$('clear').disabled=items.length===0;
}
function render(){
 const list=$('list');list.replaceChildren();
 $('count').textContent=items.length+'種（計'+items.reduce((n,x)=>n+x.qty,0)+'点）';
 if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='商品を次々にかざしてください';list.append(e);}
 items.forEach((item,i)=>{
  const row=document.createElement('div');row.className='item';
  const code=document.createElement('span');code.className='code';code.textContent=item.code;
  const qty=document.createElement('div');qty.className='qty';
  const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','数量を減らす');
  minus.onclick=()=>{if(item.qty>1){item.qty--;persist();render();}};
  const val=document.createElement('span');val.textContent=item.qty;
  const plus=document.createElement('button');plus.textContent='＋';plus.setAttribute('aria-label','数量を増やす');
  plus.onclick=()=>{item.qty++;persist();render();beep(true);};
  qty.append(minus,val,plus);
  const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','この商品を削除');
  del.onclick=()=>{items.splice(i,1);persist();render();};
  row.append(code,qty,del);list.append(row);
 });
 controls();
}
function unlockAudio(){
 try{const A=window.AudioContext||window.webkitAudioContext;if(A&&!audio)audio=new A();if(audio&&audio.state==='suspended')audio.resume();}catch(e){}
}
function beep(duplicate){
 if(!sound||!audio||audio.state!=='running')return;
 try{const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=duplicate?1800:2300;g.gain.setValueAtTime(.38,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.16);}catch(e){}
}
function onRead(value){
 const code=String(value).replace(/[\s-]/g,'');
 if(!/^\d{13}$/.test(code))return;
 const now=Date.now();
 if(code===lastCode&&now-lastSeen<1300){lastSeen=now;return;}
 if(now-lastAccept<600)return;
 lastCode=code;lastSeen=now;lastAccept=now;
 const i=items.findIndex(x=>x.code===code);
 if(i>=0){const current=items.splice(i,1)[0];current.qty++;items.unshift(current);status('✓ 数量＋1：'+code);}
 else {items.unshift({code,qty:1});status('✓ 読み取り成功：'+code);}
 beep(i>=0);if(navigator.vibrate)navigator.vibrate(80);persist();render();
 // 最新の読み取り結果を常に一覧の先頭で表示する
 $('list').scrollTop=0;
}
// 端末のカメラ一覧を取得。名称が取得できる場合は背面を優先。
let detectedCameras=[];
async function detectCameras(){
 if(typeof Html5Qrcode==='undefined')throw Error('バーコードライブラリが読み込めません');
 const cams=await Html5Qrcode.getCameras();
 detectedCameras=Array.isArray(cams)?cams:[];
 return detectedCameras;
}
function backCameraFirst(cams){
 return [...cams].sort((a,b)=>{
  const rank=cam=>/back|rear|environment|背面|後面|アウト/i.test(cam.label||'')?0:1;
  return rank(a)-rank(b);
 });
}
async function start(){
 if(running||busy)return;
 busy=true;controls();status('カメラを探しています...');
 try{
  if(typeof Html5Qrcode==='undefined')throw Error('読み取りライブラリを読み込めません');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
   throw Error('ブラウザがカメラに対応していないか、安全なHTTPS接続ではありません');
  }
  if(!scanner)scanner=new Html5Qrcode('reader',{
   formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],verbose:false
  });
  const config={
   fps:15,
   qrbox:(w,h)=>({
    width:Math.max(100,Math.min(340,Math.floor(w*.92))),
    height:Math.max(75,Math.min(110,Math.floor(h*.55)))
   }),
   disableFlip:true
  };
  const candidates=[{facingMode:'environment'}];
  let detectionError=null;
  try{
   const cams=await detectCameras();
   for(const cam of backCameraFirst(cams)){
    if(!candidates.includes(cam.id))candidates.push(cam.id);
   }
  }catch(e){detectionError=e;}
  // デバイス名が取得できない環境でも、デフォルトカメラを試す。
  candidates.push({facingMode:'user'});
  let startError=null;
  for(const camera of candidates){
   try{
    status('カメラを起動中...');
    await scanner.start(camera,config,onRead,()=>{});
    running=true;break;
   }catch(e){startError=e;}
  }
  if(!running){
   if(!candidates.length){
    throw detectionError||Error('利用できるカメラが見つかりません');
   }
   throw startError||detectionError||Error('カメラを起動できません');
  }
  status('スキャン中：JANをかざしてください');
 }catch(e){
  const detail=e.message||String(e);
  status('カメラエラー：'+detail+'。ブラウザのカメラ許可を確認し、再起動を試してください。');
 }finally{busy=false;controls();}
}
async function stop(){
 if(!running||busy)return;busy=true;controls();
 try{await scanner.stop();running=false;status('カメラを停止しました');}
 catch(e){status('停止エラー：'+(e.message||String(e)));}
 finally{busy=false;controls();}
}
$('start').onclick=()=>{unlockAudio();start();};
$('stop').onclick=stop;
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 音ON':'🔇 音OFF';unlockAudio();};
$('clear').onclick=()=>{if(!items.length||!confirm('一覧をクリアしますか？'))return;items=[];persist();render();status('一覧をクリアしました');};
$('copy').onclick=async()=>{
 if(!items.length)return;
 // スプレッドシートへ貼り付けやすい「JANコード<TAB>数量」形式。
 const value=items.map(item=>item.code+'\t'+item.qty).join('\n');
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(value);
  }else{
   const textarea=document.createElement('textarea');
   textarea.value=value;textarea.style.position='fixed';textarea.style.opacity='0';
   document.body.append(textarea);textarea.focus();textarea.select();
   if(!document.execCommand('copy'))throw Error('コピーが拒否されました');
   textarea.remove();
  }
  status('✓ '+items.length+'種類のJANと数量をコピーしました');
 }catch(e){
  status('コピーできませんでした：'+(e.message||String(e)));
 }
};
document.addEventListener('pointerdown',unlockAudio,{once:true});
render();
window.addEventListener('load',()=>start());
</script>
</body>
</html>
